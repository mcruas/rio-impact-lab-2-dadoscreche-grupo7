openapi: 3.0.3
info:
  title: Motor de Match
  version: "1.0.0"
  description: >
    Calcula critérios de pontuação e posição na fila a partir dos dados de
    Inscrição e Documentação (consumidos por contrato, GET /inscricoes/{cpf}
    e GET /documentos?inscricao_id=). Expõe o status consultado pela Tela 3
    (Acompanhamento). Ver eda/RESULTADOS_H6_H12.md antes de desenhar a régua
    de pontuação: no dado real, contar ponto só quando resposta E confirmado
    concordam (resposta='Sim' AND confirmado='Sim'), e nunca comparar
    pontuação bruta entre regras/anos diferentes sem normalizar.
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
  /criterios:
    get:
      summary: Lista os critérios de match vigentes e seus pesos
      responses:
        "200":
          description: Lista de critérios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/criterio_match.schema.json"
  /status/{cpf}:
    get:
      summary: Consulta o status/posição na fila de uma criança
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status atual
          content:
            application/json:
              schema:
                $ref: "./schemas/status_fila.schema.json"
        "404":
          description: Nenhum status encontrado para esse CPF
  /nao-confirmados:
    post:
      summary: >
        Marca um lote de inscrições como não confirmadas (a família não
        respondeu à convocação dentro do prazo, nem pelo telefone nem pelo
        fluxo manual do diretor) e recalcula a alocação excluindo-as. Chamado
        pelo Eixo 3 (acompanhamento) numa rotina periódica, em lote -- nunca
        uma chamada por criança, para não recalcular a alocação inteira a
        cada liberação isolada. Quem é marcado passa a aparecer como
        status=Cancelado em GET /status/{cpf}; a vaga liberada é redistribuída
        pela mesma ordem de mérito de sempre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/lote_nao_confirmados.schema.json"
      responses:
        "200":
          description: Alocação recalculada
          content:
            application/json:
              schema:
                type: object
                required: ["excluidos_total"]
                properties:
                  excluidos_total:
                    type: integer
                    description: Total acumulado de inscrições excluídas da alocação até agora.
        "404":
          description: Algum CPF do lote não corresponde a nenhuma inscrição conhecida
  /vagas-selecionadas:
    get:
      summary: >
        Painel operacional para CRE/polo: cadastros com uma opção em
        situação Selecionado/Selecionado da lista no processo real de 2025
        -- vaga oferecida à família, ainda sem confirmação. Hoje isso só é
        visível conferindo linha a linha; este endpoint sinaliza direto,
        por unidade e por criança. `dias_desde_criacao_cadastro` é uma
        APROXIMAÇÃO (idade do cadastro, não da situação -- ver o schema).
      parameters:
        - name: unidade
          in: query
          required: false
          schema:
            type: string
          description: Filtra só as vagas selecionadas nesta unidade.
      responses:
        "200":
          description: Lista de vagas selecionadas aguardando confirmação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/vaga_selecionada.schema.json"
  /inconsistencias:
    get:
      summary: >
        Painel operacional para CRE/polo: cadastros em que uma opção está
        ofertada (Selecionado/Selecionado da lista) enquanto outra opção do
        MESMO cadastro segue em Lista de espera -- só aparece comparando as
        opções de um cadastro entre si, não lendo uma linha por vez.
      parameters:
        - name: unidade
          in: query
          required: false
          schema:
            type: string
          description: Filtra só cadastros em que pelo menos uma opção conflitante é nesta unidade.
      responses:
        "200":
          description: Lista de cadastros com opções inconsistentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/inconsistencia_cadastro.schema.json"
  /historico/{cpf}:
    get:
      summary: >
        [PROPOSTO, ainda não implementado — ver nota em ../../modulos/match-engine/README.md]
        Histórico de convocação/comparecimento do responsável em processos
        anteriores. Consumido pelo módulo Inscrição antes de chamar
        POST /recomendacoes do módulo Recomendação de Escola.
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Histórico do responsável (vezes_convocado=0 para quem nunca
            participou de um processo — não é erro, é o estado inicial normal).
          content:
            application/json:
              schema:
                $ref: "./schemas/historico_responsavel.schema.json"
  /score-preliminar:
    post:
      summary: >
        [PROPOSTO, ainda não implementado — ver nota em ../../modulos/match-engine/README.md]
        Calcula um score preliminar a partir de respostas autodeclaradas,
        antes da validação de documentos (Tela 2). Consumido pelo módulo
        Inscrição antes de chamar POST /recomendacoes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["respostas"]
              properties:
                respostas:
                  type: array
                  items:
                    type: object
                    required: ["criterio_id", "resposta"]
                    properties:
                      criterio_id: { type: string }
                      resposta: { type: boolean }
      responses:
        "200":
          description: Score preliminar (percentil na distribuição de scores vigente)
          content:
            application/json:
              schema:
                $ref: "./schemas/score_estimado.schema.json"
